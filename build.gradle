plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.1'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'io.github.followsclosley'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    //implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    
    implementation 'org.modelmapper:modelmapper:3.1.0'
    implementation 'org.apache.commons:commons-csv:1.9.0'

    implementation 'io.hypersistence:hypersistence-utils-hibernate-62:3.5.3'

    //implementation 'org.apache.camel.springboot:camel-spring-boot-starter:4.6.0'
    //implementation 'org.apache.camel.springboot:camel-http-starter:4.6.0'

    implementation 'org.apache.camel.springboot:camel-spring-boot-xml-starter:4.6.0'
    //implementation 'org.apache.camel.springboot:camel-spring-boot-starter:4.6.0'
    implementation 'org.apache.camel.springboot:camel-http-starter:4.6.0'
    implementation 'org.apache.camel.springboot:camel-timer-starter:4.6.0'
    implementation 'org.apache.camel:camel-zip-deflater:4.6.0'
    //implementation 'org.apache.camel:camel-jetty:4.6.0'

    //implementation 'org.springframework.boot:spring-boot-starter-integration'
    //implementation 'org.springframework.integration:spring-integration-http'

    runtimeOnly 'com.h2database:h2'

    //testImplementation 'org.springframework.integration:spring-integration-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
